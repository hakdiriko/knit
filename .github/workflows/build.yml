# Builds dendrite on Windows, macOS and Linux for every push, checks it with
# pluginval (strictness 10) and, on Linux, with the discovery audit.
name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_TAG: v1.0.4
  BUNDLE_DIR: build/dendrite_artefacts/Release

jobs:
  plugin:
    name: ${{ matrix.os-name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os-name: windows, runner: windows-2022, pluginval-zip: pluginval_Windows.zip, pluginval-bin: ./pluginval.exe }
          - { os-name: macos,   runner: macos-14,     pluginval-zip: pluginval_macOS.zip,   pluginval-bin: ./pluginval.app/Contents/MacOS/pluginval }
          - { os-name: linux,   runner: ubuntu-24.04, pluginval-zip: pluginval_Linux.zip,   pluginval-bin: ./pluginval }
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 4

      - name: Fetch pluginval
        run: |
          curl -sSLf -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_TAG}/${{ matrix.pluginval-zip }}"
          if [ "$RUNNER_OS" = "Windows" ]; then 7z x -y pluginval.zip > /dev/null; else unzip -q -o pluginval.zip; fi

      - name: Validate VST3
        run: |
          run=()
          if [ "$RUNNER_OS" = "Linux" ]; then run=(xvfb-run -a); fi
          "${run[@]}" ${{ matrix.pluginval-bin }} --strictness-level 10 --validate-in-process --timeout-ms 600000 \
            --validate "$BUNDLE_DIR/VST3/dendrite.vst3"

      - name: Validate AU
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$BUNDLE_DIR/AU/dendrite.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -strict -v aufx Vibr Hakd
          ${{ matrix.pluginval-bin }} --strictness-level 10 --validate-in-process --timeout-ms 600000 \
            --validate ~/Library/Audio/Plug-Ins/Components/dendrite.component

      - name: Discovery audit
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --user pedalboard numpy
          xvfb-run -a python3 tools/discovery_audit.py "$BUNDLE_DIR/VST3/dendrite.vst3" --out audit_report.md
          cat audit_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the audit report
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit_report.md
          if-no-files-found: ignore

      - name: Windows VST3 for Live
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dendrite-windows-vst3
          path: ${{ env.BUNDLE_DIR }}/VST3/

      - name: Zip the Mac plug-ins
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "$BUNDLE_DIR/VST3/dendrite.vst3" dist/dendrite-vst3.zip
          ditto -c -k --keepParent "$BUNDLE_DIR/AU/dendrite.component" dist/dendrite-au.zip

      - name: Mac VST3 and AU
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: dendrite-macos-vst3-au
          path: dist/
